# Local convenience only — not a production deployment manifest.
# Both services connect to the real Neon Postgres from backend/.env; there's
# no local database container since Neon is the only supported database.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8080"
    env_file:
      - ./backend/.env
    environment:
      PORT: "8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:8080"
    environment:
      PORT: "8080"
    depends_on:
      - backend
