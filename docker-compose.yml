# Local convenience only — not a production deployment manifest.
# Backend/frontend connect to the real Neon Postgres from backend/.env;
# there's no local database container since Neon is the only supported
# database. redis IS a local container here — entitlement caching only needs
# a shared backend once more than one backend instance is running, which
# doesn't apply to this single-service compose file, but it's included so
# HR_REDIS_URL has something to point at when testing that path locally.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8080"
    env_file:
      - ./backend/.env
    environment:
      PORT: "8080"
      HR_REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:8080"
    environment:
      PORT: "8080"
    depends_on:
      - backend
