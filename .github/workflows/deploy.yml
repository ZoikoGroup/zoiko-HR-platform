name: Deploy Zoiko HR Platform

on:
  # Production deploys ONLY after CI has passed on main. There is deliberately no `push` trigger: with one, a merge
  # deployed immediately, before (and regardless of) the tests, and then deployed a second time once CI finished.
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  # Keep deployment recoverable from the Actions tab if a workflow_run was
  # missed or its run was cancelled. Manual runs deploy the current main HEAD.
  workflow_dispatch:

# One production deploy at a time; a deploy that has started is never cancelled halfway through.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Optional: build the frontend on a CI runner instead of on the VM (faster, and a failed build can never leave
  # the site half-updated). Only used when the repository secret VITE_API_BASE_URL (the production API URL) is
  # set; without it this job is skipped and the VM builds the frontend exactly as before.
  prepare:
    runs-on: ubuntu-latest
    # a manual run, or a CI run that PASSED for a push to main (a pull-request CI run never deploys)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    outputs:
      ci_build: ${{ steps.check.outputs.ci_build }}
    steps:
      - id: check
        env:
          API_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -n "$API_URL" ]; then echo "ci_build=true" >> "$GITHUB_OUTPUT"; else echo "ci_build=false" >> "$GITHUB_OUTPUT"; fi

  build-frontend:
    runs-on: ubuntu-latest
    needs: prepare
    if: ${{ needs.prepare.outputs.ci_build == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [prepare, build-frontend]
    # run even when build-frontend was skipped (no secret), but not when the CI build itself failed
    if: ${{ always() && needs.prepare.result == 'success' && (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped') }}
    steps:
      - name: Download the CI-built frontend
        if: ${{ needs.prepare.outputs.ci_build == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Upload the CI-built frontend
        if: ${{ needs.prepare.outputs.ci_build == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/zoiko-frontend-release"
          strip_components: 1
          overwrite: true

      - name: SSH and deploy backend + frontend
        uses: appleboy/ssh-action@v1.0.3
        env:
          CI_BUILD: ${{ needs.prepare.outputs.ci_build }}
          # the commit CI tested (a manual run: the current main HEAD). Deployed exactly, never "whatever main is now",
          # so a commit merged while this one was being tested cannot go live untested.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: CI_BUILD,DEPLOY_SHA
          script: |
            set -e
            echo "Deploying $DEPLOY_SHA"

            cd /var/www/zoiko-hr-backend/app
            git fetch origin main
            # fast-forward to the tested commit; if a newer tested commit is already live this is a no-op
            git merge --ff-only "$DEPLOY_SHA"
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            alembic upgrade head
            deactivate
            sudo systemctl restart zoiko-hr-backend

            # Health check: the deploy only succeeds if the restarted backend answers /super-admin/health (which also
            # runs SELECT 1 against the database) within 90s. Without this a backend that crashes on start-up, or
            # can't reach the database, still showed a green deploy. The port is read from the systemd unit
            # (uvicorn --port / gunicorn --bind), default 8000.
            PORT=$(systemctl cat zoiko-hr-backend 2>/dev/null | grep -oE -- '(--port[= ]+|--bind[= ]+[^ :]*:|-b +[^ :]*:)[0-9]+' | grep -oE '[0-9]+$' | head -1)
            HEALTH_URL="http://127.0.0.1:${PORT:-8000}/super-admin/health"
            echo "Waiting for $HEALTH_URL"
            healthy=false
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 "$HEALTH_URL" > /dev/null 2>&1; then healthy=true; break; fi
              sleep 3
            done
            if [ "$healthy" != "true" ]; then
              echo "::error::Backend did not become healthy within 90s after restart"
              sudo systemctl status zoiko-hr-backend --no-pager -l | head -20 || true
              sudo journalctl -u zoiko-hr-backend -n 60 --no-pager || true
              exit 1
            fi
            echo "Backend healthy"

            if [ "$CI_BUILD" = "true" ] && [ -f /tmp/zoiko-frontend-release/index.html ]; then
              # prebuilt by CI: swap the files in
              sudo rm -rf /var/www/zoiko-hr-platform/html/*
              sudo cp -r /tmp/zoiko-frontend-release/* /var/www/zoiko-hr-platform/html/
              rm -rf /tmp/zoiko-frontend-release
            else
              # no CI build available: build on the VM, as before
              cd /var/www/zoiko-hr-platform/app
              git fetch origin main
              git merge --ff-only "$DEPLOY_SHA"
              cd frontend
              npm install
              npm run build
              sudo rm -rf /var/www/zoiko-hr-platform/html/*
              sudo cp -r dist/* /var/www/zoiko-hr-platform/html/
            fi
            sudo chown -R www-data:www-data /var/www/zoiko-hr-platform/html
