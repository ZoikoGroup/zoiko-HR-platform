name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hr_test
          POSTGRES_PASSWORD: hr_test
          POSTGRES_DB: hr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hr_test -d hr_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run backend test suite
        run: pytest -q
        env:
          HR_DATABASE_URL: postgresql://hr_test:hr_test@localhost:5432/hr_test?sslmode=disable
          HR_SECRET_KEY: ci-secret-key-for-tests-only
          SUPER_ADMIN_SETUP_KEY: ci-setup-key
          HR_DEBUG: "true"

  frontend-build:
    name: Frontend build + secret-leak check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Secret-leak check (dist must not contain Stripe test keys)
        run: |
          if grep -rE "sk_(live|test)_" dist/ 2>/dev/null; then
            echo "::error::Stripe secret key found in frontend build output (dist/)."
            exit 1
          fi
          echo "dist/ is clean of sk_live_/sk_test_ secrets."
