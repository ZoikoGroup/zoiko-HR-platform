name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zoiko_hr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Use the same non-superuser role for Alembic and the application/tests.
      # This role owns migrated tables, so CI exercises the actual runtime
      # privilege model instead of relying on the postgres superuser.
      HR_DATABASE_URL: postgresql://zhr_ci:zhr_ci@localhost:5432/zoiko_hr_test
      HR_SECRET_KEY: ci-test-secret-key-not-for-production
      HR_DEBUG: "true"
      SUPER_ADMIN_SETUP_KEY: ci-test-setup-key
      HR_REDIS_URL: redis://localhost:6379/0
      HR_PRIVACY_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create the CI database role
        env:
          PGPASSWORD: postgres
        run: |
          ready=false
          for attempt in $(seq 1 30); do
            if psql -w -h localhost -U postgres -d zoiko_hr_test -c '\q'; then
              ready=true
              break
            fi
            echo "PostgreSQL is not accepting connections yet (attempt $attempt/30)." >&2
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "PostgreSQL did not become ready within 60 seconds." >&2
            exit 1
          fi
          psql -h localhost -U postgres -d zoiko_hr_test <<'SQL'
            CREATE ROLE zhr_ci WITH LOGIN PASSWORD 'zhr_ci'
              NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            GRANT CONNECT, TEMPORARY ON DATABASE zoiko_hr_test TO zhr_ci;
            GRANT USAGE, CREATE ON SCHEMA public TO zhr_ci;
          SQL
          psql -h localhost -U postgres -d zoiko_hr_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run DB migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify migrated schema and CI privileges
        env:
          PGPASSWORD: zhr_ci
        run: |
          psql -h localhost -U zhr_ci -d zoiko_hr_test -v ON_ERROR_STOP=1 <<'SQL'
            DO $$
            BEGIN
              IF current_user <> 'zhr_ci' THEN
                RAISE EXCEPTION 'CI connected as %, expected zhr_ci', current_user;
              END IF;
              IF NOT has_table_privilege('zhr_ci', 'employees', 'SELECT,INSERT,UPDATE,DELETE') THEN
                RAISE EXCEPTION 'CI role is missing employee table privileges';
              END IF;
              IF NOT has_sequence_privilege('zhr_ci', pg_get_serial_sequence('employees', 'id'), 'USAGE,SELECT') THEN
                RAISE EXCEPTION 'CI role is missing employee ID sequence privileges';
              END IF;
            END $$;
            SELECT count(*) AS alembic_versions FROM alembic_version;
            SELECT tablename, tableowner FROM pg_tables
              WHERE schemaname = 'public' AND tablename IN ('employees','organizations','leave_requests')
              ORDER BY tablename;
          SQL

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests (node:test)
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
