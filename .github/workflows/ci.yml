name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zoiko_hr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zoiko_hr_test
      HR_SECRET_KEY: ci-test-secret-key-not-for-production
      HR_DEBUG: "true"
      SUPER_ADMIN_SETUP_KEY: ci-test-setup-key
      HR_REDIS_URL: redis://localhost:6379/0
      HR_PRIVACY_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create 'root' DB role and grant privileges
        # Single-user rule: migrations AND tests both run as `postgres` via
        # HR_DATABASE_URL (see env above and backend/alembic/env.py, which
        # resolves the same URL). Do NOT point HR_DATABASE_URL at `root`:
        # tables/sequences created by alembic are owned by `postgres`, and a
        # second user is exactly what causes permission-denied mismatches.
        # The `root` role exists only as a convenience login; grants below
        # (tables AND sequences, present AND future, for objects created by
        # either role) keep it usable without making it the runtime user.
        env:
          PGPASSWORD: postgres
        run: |
          ready=false
          for attempt in $(seq 1 30); do
            if psql -w -h localhost -U postgres -d zoiko_hr_test -c '\q'; then
              ready=true
              break
            fi
            echo "PostgreSQL is not accepting connections yet (attempt $attempt/30)." >&2
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "PostgreSQL did not become ready within 60 seconds." >&2
            exit 1
          fi
          psql -h localhost -U postgres -d zoiko_hr_test <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'root') THEN
                CREATE ROLE root WITH LOGIN PASSWORD 'root';
              END IF;
            END $$;
            GRANT ALL PRIVILEGES ON DATABASE zoiko_hr_test TO root;
            GRANT USAGE ON SCHEMA public TO root;
            -- Existing objects (migrations may already have run in a retried job).
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO root;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO root;
            -- Future objects, whoever creates them (alembic runs as postgres;
            -- ad-hoc DDL in a debug session may run as root). The bare
            -- `ALTER DEFAULT PRIVILEGES IN SCHEMA public ...` form only covers
            -- the current role, so both creators are listed explicitly.
            ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO root;
            ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO root;
            ALTER DEFAULT PRIVILEGES FOR ROLE root IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO postgres;
            ALTER DEFAULT PRIVILEGES FOR ROLE root IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO postgres;
          SQL
          psql -h localhost -U postgres -d zoiko_hr_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run DB migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Reapply DB grants for root (ensure permissions after migrations)
        # GRANT ... ON ALL TABLES/SEQUENCES only touches objects that exist
        # at that moment, so the pre-migration grants above are no-ops on a
        # fresh DB. Re-issue them here, after alembic created the tables.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d zoiko_hr_test <<'SQL'
            GRANT USAGE ON SCHEMA public TO root;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO root;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO root;
            ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO root;
            ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO root;
            ALTER DEFAULT PRIVILEGES FOR ROLE root IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO postgres;
            ALTER DEFAULT PRIVILEGES FOR ROLE root IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO postgres;
          SQL

      - name: Verify migrated schema (fail fast)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d zoiko_hr_test -c "SELECT count(*) AS alembic_versions FROM alembic_version;"
          psql -h localhost -U postgres -d zoiko_hr_test -c "SELECT tablename, tableowner FROM pg_tables WHERE schemaname='public' AND tablename IN ('employees','organizations','leave_requests') ORDER BY tablename;"
          # Postgres logs during pytest are EXPECTED: backend/tests/privacy/test_rls_postgres.py deliberately provokes
          # them (platform-role denial, garbage-tenant fail-closed check, cross-tenant FK check) and asserts on them.

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests (node:test)
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build