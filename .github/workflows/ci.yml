name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zoiko_hr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zoiko_hr_test
      HR_SECRET_KEY: ci-test-secret-key-not-for-production
      HR_DEBUG: "true"
      SUPER_ADMIN_SETUP_KEY: ci-test-setup-key
      HR_REDIS_URL: redis://localhost:6379/0
      HR_PRIVACY_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create 'root' DB role and grant privileges
        env:
          PGPASSWORD: postgres
        run: |
          ready=false
          for attempt in $(seq 1 30); do
            if psql -w -h localhost -U postgres -d zoiko_hr_test -c '\q'; then
              ready=true
              break
            fi
            echo "PostgreSQL is not accepting connections yet (attempt $attempt/30)." >&2
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "PostgreSQL did not become ready within 60 seconds." >&2
            exit 1
          fi
          psql -h localhost -U postgres -d zoiko_hr_test <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'root') THEN
                CREATE ROLE root WITH LOGIN PASSWORD 'root';
              END IF;
            END $$;
            GRANT ALL PRIVILEGES ON DATABASE zoiko_hr_test TO root;
            GRANT USAGE ON SCHEMA public TO root;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO root;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO root;
          SQL
          psql -h localhost -U postgres -d zoiko_hr_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run DB migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests (node:test)
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build